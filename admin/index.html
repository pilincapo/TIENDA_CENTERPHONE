<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" />
    <link rel="stylesheet" href="/src/web/styles.css" />
  </head>
  <body>
    <div id="login" class="login" hidden>
      <form id="login-form" class="login-card">
        <h1>Admin · <span id="login-store">…</span></h1>
        <input id="login-password" type="password" placeholder="Contraseña" required />
        <button type="submit" class="btn btn-primary">Ingresar</button>
        <p id="login-error" class="error" hidden></p>
      </form>
    </div>

    <div id="app" hidden>
      <header class="topbar">
        <a class="brand" href="/admin/"><img class="brand-logo" src="/logo.jpg" alt=""/><span>Admin</span></a>
        <button id="logout" class="btn btn-ghost">Salir</button>
      </header>
      <nav class="menu" id="tabs" aria-label="Secciones del panel">
        <div class="menu-group">
          <span class="menu-label">Ventas</span>
          <div class="menu-links">
            <a href="#orders" data-tab="orders">Pedidos</a>
            <a href="#stats" data-tab="stats">Estadísticas</a>
          </div>
        </div>
        <div class="menu-group">
          <span class="menu-label">Catálogo</span>
          <div class="menu-links">
            <a href="#products" data-tab="products">Productos</a>
            <a href="#categories" data-tab="categories">Categorías</a>
          </div>
        </div>
        <div class="menu-group">
          <span class="menu-label">Importación</span>
          <div class="menu-links">
            <a href="#import" data-tab="import">Importar</a>
            <a href="#auto" data-tab="auto">Auto-imp.</a>
            <a href="#rules" data-tab="rules">Reglas</a>
          </div>
        </div>
        <div class="menu-group">
          <span class="menu-label">Sistema</span>
          <div class="menu-links">
            <a href="#dashboard" data-tab="dashboard">Dashboard</a>
            <a href="#settings" data-tab="settings">Configuración</a>
          </div>
        </div>
      </nav>
      <main class="admin-main" id="view"></main>
    </div>

    <script type="module" src="/src/web/admin.ts"></script>
  </body>
</html>
